<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canvas Sidebar Toggle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Canvas sidebars</h1>

  <label class="row">
    <span>
      <span class="name">Global navigation</span>
      <span class="hint" data-command="toggle-global-nav"></span>
    </span>
    <input type="checkbox" class="switch" data-key="hideGlobalNav" data-invert>
  </label>

  <label class="row">
    <span>
      <span class="name">Course menu</span>
      <span class="hint" data-command="toggle-course-menu"></span>
    </span>
    <input type="checkbox" class="switch" data-key="hideCourseMenu" data-invert>
  </label>

  <label class="row">
    <span>
      <span class="name">Full-width content</span>
      <span class="hint" data-command="toggle-full-width"></span>
    </span>
    <input type="checkbox" class="switch" data-key="fullWidth">
  </label>

  <label class="row">
    <span>
      <span class="name">On-page buttons</span>
      <span class="hint">Bottom-left of Canvas pages</span>
    </span>
    <input type="checkbox" class="switch" data-key="hidePageButtons" data-invert>
  </label>

  <p class="footer"><a href="#" id="shortcuts">Change shortcuts</a></p>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
